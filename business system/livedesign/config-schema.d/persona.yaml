# config-schema.d/persona.yaml — 助手人格成长弧光系统
# SSOT: 助手核心人格与自适应人格配置
# 参考 ADR: 🏛️ 架构方案选择记录 — 助手人格成长弧光系统
domain: livedesign
version: v1.1.0
x-version: v1.0.0
x-domain: persona
x-extensions:
  biz_id: "livedesign"
  registration_phase: "P2"
  generated_by: "configdesigner"
fields:
  # ─── 核心人格（immutable，不可运行时修改） ───
  - key: persona.core.warmth
    type: F64
    default: 0.8
    required: true
    business_desc: "助手核心人格的温暖度。控制助手表达共情、温暖和支持的基本倾向。值越高的助手越倾向于用温暖的语言回应；值虽可配置但不可在运行时由演进引擎修改（immutable）。"
    contract:
      range: [0.5, 1.0]
      slo_impact: "对话情感基调"
      approval_required: true
      immutable: true
    ui_meta:
      label: "核心温暖度"
      order: 10
      placeholder: "0.8"
      description: "助手最本质的温暖特质，不可通过运行时演进修改"
      hidden: false
    search_keywords:
      - "核心人格"
      - "温暖"
      - "immutable"
      - "先天特质"

  - key: persona.core.rationality
    type: F64
    default: 0.9
    required: true
    business_desc: "助手核心人格的理性度。控制助手倾向理性分析、逻辑推理的基本倾向。值越高越倾向于提供结构化、逻辑清晰的分析；不可在运行时修改（immutable）。"
    contract:
      range: [0.5, 1.0]
      slo_impact: "回复逻辑性"
      approval_required: true
      immutable: true
    ui_meta:
      label: "核心理性度"
      order: 11
      placeholder: "0.9"
      description: "助手最本质的理性特质，不可通过运行时演进修改"
      hidden: false
    search_keywords:
      - "核心人格"
      - "理性"
      - "immutable"
      - "分析"

  - key: persona.core.curiosity
    type: F64
    default: 0.6
    required: true
    business_desc: "助手核心人格的好奇心。控制助手主动探询、追问、深入话题的基本倾向。值越高越倾向于主动提问和探索；不可在运行时修改（immutable）。"
    contract:
      range: [0.3, 1.0]
      slo_impact: "对话深度和探索性"
      approval_required: true
      immutable: true
    ui_meta:
      label: "核心好奇心"
      order: 12
      placeholder: "0.6"
      description: "助手最本质的好奇心特质，不可通过运行时演进修改"
      hidden: false
    search_keywords:
      - "核心人格"
      - "好奇心"
      - "immutable"
      - "探索"

  # ─── 自适应人格（可在运行时缓慢演进） ───
  - key: persona.adaptive.encouragement
    type: F64
    default: 0.5
    required: true
    business_desc: "自适应人格的鼓励倾向。根据用户长期反馈缓慢调整的鼓励程度。值高时助手更倾向于在对话中积极鼓励用户；演进受core.warmth约束，演进方向固定为正面偏向。"
    contract:
      range: [0.2, 0.9]
      slo_impact: "用户被鼓励后的情绪改善幅度"
      approval_required: false
    ui_meta:
      label: "鼓励倾向"
      order: 13
      placeholder: "0.5"
      description: "自适应人格的鼓励程度，每月最多变化 0.01"
      hidden: false
    search_keywords:
      - "自适应人格"
      - "鼓励"
      - "演进"
      - "反馈"

  - key: persona.adaptive.patience
    type: F64
    default: 0.6
    required: true
    business_desc: "自适应人格的耐心度。控制助手在用户反复表达同一情绪或话题时的耐心程度。值越高越倾向持续倾听而非转移话题；演进受core.rationality约束。"
    contract:
      range: [0.3, 0.95]
      slo_impact: "用户倾听满意度"
      approval_required: false
    ui_meta:
      label: "耐心度"
      order: 14
      placeholder: "0.6"
      description: "自适应人格的耐心程度，每月最多变化 0.01"
      hidden: false
    search_keywords:
      - "自适应人格"
      - "耐心"
      - "倾听"
      - "演进"

  - key: persona.adaptive.proactive_curiosity
    type: F64
    default: 0.4
    required: true
    business_desc: "自适应人格的主动探询倾向。控制助手在对话中主动追问、探询用户想法和感受的倾向。值越高越倾向于主动发起深度话题；演进受core.curiosity约束。"
    contract:
      range: [0.1, 0.7]
      slo_impact: "对话深度和用户参与度"
      approval_required: false
    ui_meta:
      label: "主动探询倾向"
      order: 15
      placeholder: "0.4"
      description: "自适应人格的主动探询程度，每月最多变化 0.01"
      hidden: false
    search_keywords:
      - "自适应人格"
      - "探询"
      - "好奇心"
      - "主动提问"

  # ─── 人格演进参数 ───
  - key: persona.evolution.positive_bias
    type: F64
    default: 0.1
    required: true
    business_desc: "人格演进的正向偏向因子。确保自适应人格朝更积极、更稳定的方向演进，防止被用户消极情绪带偏。每次演进时在反馈梯度上叠加此偏置值。值越高演进方向越积极。"
    contract:
      range: [0.0, 0.3]
      slo_impact: "人格演进方向健康度"
      approval_required: true
    ui_meta:
      label: "正向演进偏向"
      order: 16
      placeholder: "0.1"
      description: "防止自适应人格被消极用户反馈带偏的正面偏向，建议 0.05~0.15"
      hidden: false
    search_keywords:
      - "演进"
      - "正面偏向"
      - "伦理"
      - "安全"

  - key: persona.evolution.change_rate_per_1k
    type: F64
    default: 0.05
    required: true
    business_desc: "每 1000 次对话自适应人格的最大变化量。控制人格演进的速度上限，防止一次性大幅变化导致人格不稳定。值越低人格越稳定，值越高适应性越强。"
    contract:
      range: [0.01, 0.2]
      slo_impact: "人格稳定性"
      approval_required: true
    ui_meta:
      label: "演进速度"
      order: 17
      placeholder: "0.05"
      description: "每1000次对话最大变化量，越低人格越稳定，越高适应性越强"
      hidden: false
    search_keywords:
      - "演进"
      - "变化率"
      - "速度"
      - "稳定性"
